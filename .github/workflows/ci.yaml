name: Crypto Whale Tracker CI/CD

on:
  push:
    branches: [ "main", "feature/*" ]

jobs:
  # Job 1: Build & Push Backend
  build-and-push-backend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        # เปลี่ยน username ตรงนี้ให้ตรงกับของคุณถ้าต้องการ หรือใช้ตัวแปร secret ได้เลย
        tags: ${{ secrets.DOCKER_USERNAME }}/crypto-whale-tracker-backend:latest

  # Job 2: Build & Push Frontend
  build-and-push-frontend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/crypto-whale-tracker-frontend:latest