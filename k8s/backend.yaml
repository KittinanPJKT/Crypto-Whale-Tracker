apiVersion: apps/v1
kind: Deployment
metadata:
  name: whale-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whale-backend
  template:
    metadata:
      labels:
        app: whale-backend
    spec:
      containers:
      - name: backend
        image: crypto-whale-tracker-backend:v3
        imagePullPolicy: IfNotPresent
        env:
        - name: DB_URL
          value: "postgres://root:password@postgres:5432/whale_tracker?sslmode=disable"
        ports:
        - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: NodePort
  selector:
    app: whale-backend
  ports:
  - port: 9090
    targetPort: 9090
    nodePort: 30090