apiVersion: apps/v1
kind: Deployment
metadata:
  name: whale-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whale-frontend
  template:
    metadata:
      labels:
        app: whale-frontend
    spec:
      containers:
      - name: frontend
        image: crypto-whale-tracker-frontend:v3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: whale-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080