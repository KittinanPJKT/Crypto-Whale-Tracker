#version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: whale_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: whale_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

# Go backend
  backend:
    build: ./backend
    container_name: whale_backend
    ports:
      - "9090:9090"
    environment:
      - DB_URL=postgres://root:password@postgres:5432/whale_tracker?sslmode=disable
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: whale_postgres
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=whale_tracker
    ports:
      - "5432:5432"
      
# React frontend
  frontend:
    build: ./frontend
    container_name: whale_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

# Prometheus and Grafana for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: whale_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090" # หลบพอร์ต 9090 ของ Go Backend มาใช้ 9091 แทน
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: whale_grafana
    ports:
      - "3000:3000" # Grafana จะรันอยู่ที่พอร์ต 3000
    depends_on:
      - prometheus


volumes:
  pgdata: